{% extends "user/layouts/base.html" %} {% block title %}Survey{% endblock %}
{% block content %}
  <main class="flex-1 px-5 pt-6 pb-40 lg:pb-10 max-w-4xl w-full lg:mx-auto">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900 leading-tight">Survey</h1>
      <p class="text-sm text-gray-500 mt-0.5">Your submitted satisfaction surveys.</p>
    </div>
    <div id="surveySkeleton" class="space-y-4">
      {% for n in "123" %}
        <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-5">
          <div class="flex items-start justify-between mb-4">
            <div class="space-y-2">
              <div class="skeleton h-3.5 w-32 rounded"></div>
              <div class="skeleton h-2.5 w-20 rounded"></div>
            </div>
            <div class="skeleton h-6 w-24 rounded-full"></div>
          </div>
          <div class="skeleton h-3 w-3/4 rounded mb-3"></div>
          <div class="skeleton h-3 w-40 rounded mb-4"></div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
            <div class="skeleton h-14 rounded-xl"></div>
            <div class="skeleton h-14 rounded-xl"></div>
            <div class="skeleton h-14 rounded-xl"></div>
          </div>
          <div class="skeleton h-12 rounded-xl"></div>
        </div>
      {% endfor %}
    </div>
    <div id="surveyContainer" class="hidden"></div>
  </main>
  <script>
      document.addEventListener("DOMContentLoaded", function() {
          const surveySkeleton = document.getElementById("surveySkeleton");
          const surveyContainer = document.getElementById("surveyContainer");

          fetch("{% url 'userSurveyAjax' %}")
              .then(function(response) {
                  return response.json();
              })
              .then(function(data) {
                  surveyContainer.innerHTML = data.html;

                  surveyContainer.style.opacity = '0';
                  surveyContainer.classList.remove('hidden');

                  surveySkeleton.style.transition = 'opacity 0.25s ease-out';
                  surveySkeleton.style.opacity = '0';

                  setTimeout(function() {
                      surveySkeleton.classList.add('hidden');

                      surveyContainer.style.transition = 'opacity 0.25s ease-in';
                      requestAnimationFrame(function() {
                          surveyContainer.style.opacity = '1';
                      });
                  }, 250);
              })
              .catch(function(error) {
                  console.error("Failed to load surveys:", error);
              });
      });
  </script>
{% endblock %}
