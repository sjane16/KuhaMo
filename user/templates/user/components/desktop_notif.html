<!-- ============================= -->
<!-- DESKTOP FLOATING NOTIFICATION -->
<!-- ============================= -->
<div class="hidden lg:block fixed top-6 right-8 z-50">
    {% if active_page == 'userNotifications' %}
        <span class="relative inline-block cursor-default">
            <svg class="w-7 h-7 text-blue-600"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
            </svg>
        </span>
    {% else %}
        <button type="button" onclick="toggleNotifDropdown()" class="relative">
            <svg id="notif_bell_icon"
                 class="w-7 h-7 text-gray-500 transition-colors"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
            </svg>
            {% if unread_notifications_count > 0 %}
                <span id="desktop_notif_badge"
                      class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">
                    {{ unread_notifications_count }}
                </span>
            {% endif %}
        </button>
    {% endif %}
    <!-- Dropdown -->
    <div id="notif_dropdown"
         class="hidden absolute right-0 top-10 w-80 bg-white rounded-2xl shadow-xl border border-gray-100">
        <div class="px-4 py-3 border-b border-gray-100">
            <h3 class="text-base font-bold text-gray-900">Notifications</h3>
        </div>
        <div class="px-4 pt-3 flex items-center gap-2">
            <button type="button"
                    id="notif_tab_all"
                    data-filter="all"
                    class="notif-dropdown-tab px-3 py-1 rounded-full text-xs font-semibold transition-colors bg-blue-100 text-blue-600">
                All
            </button>
            <button type="button"
                    id="notif_tab_unread"
                    data-filter="unread"
                    class="notif-dropdown-tab px-3 py-1 rounded-full text-xs font-semibold transition-colors text-gray-500 hover:bg-gray-100">
                Unread
            </button>
        </div>
        <div id="notif_list"
             class="max-h-96 overflow-y-auto divide-y divide-gray-100 mt-2">
            {% for n in "1234" %}
                <div class="flex items-start gap-3 px-4 py-3">
                    <div class="skeleton w-11 h-11 rounded-full shrink-0"></div>
                    <div class="flex-1 min-w-0 space-y-2 pt-1">
                        <div class="skeleton h-3 w-full rounded"></div>
                        <div class="skeleton h-2.5 w-16 rounded"></div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
<script>
    const notifDropdown = document.getElementById("notif_dropdown");
    const notifList = document.getElementById("notif_list");
    const notifTabAll = document.getElementById("notif_tab_all");
    const notifTabUnread = document.getElementById("notif_tab_unread");

    const notifBellIcon = document.getElementById("notif_bell_icon");

    function toggleNotifDropdown() {
        notifDropdown.classList.toggle("hidden");
        const isOpen = !notifDropdown.classList.contains("hidden");

        if (isOpen) {
            loadNotifications();
            notifBellIcon.classList.remove("text-gray-500");
            notifBellIcon.classList.add("text-blue-600");
        } else {
            notifBellIcon.classList.remove("text-blue-600");
            notifBellIcon.classList.add("text-gray-500");
        }
    }

    let currentNotifFilter = "all";

    const STATUS_BADGES = {
        pending: {
            color: "bg-orange-500",
            icon: `<path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />`,
        },
        in_progress: {
            color: "bg-sky-500",
            icon: `<path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />`,
        },
        resolved: {
            color: "bg-green-500",
            icon: `<path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />`,
        },
        closed: {
            color: "bg-gray-500",
            icon: `<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 7.5h16.5M6.75 7.5V6A2.25 2.25 0 019 3.75h6A2.25 2.25 0 0117.25 6v1.5M5.25 7.5V18A2.25 2.25 0 007.5 20.25h9A2.25 2.25 0 0018.75 18V7.5" />`,
        },
    };

    function buildNotifItem(notif) {
        const badge = STATUS_BADGES[notif.status] || STATUS_BADGES.pending;

        const item = document.createElement("a");
        item.href = `/user/notifications/${notif.id}/view/`;
        item.className = `flex items-start gap-3 px-4 py-3 hover:bg-gray-50 transition-colors ${
      notif.is_read ? "bg-white" : "bg-blue-50"
    }`;
        item.innerHTML = `
        <div class="relative shrink-0">
          <div class="w-11 h-11 rounded-full bg-gray-200 flex items-center justify-center">
            <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-3z" />
                <circle cx="12" cy="10.5" r="1.8" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.7 16.8c.9-2 2-3 3.3-3s2.4 1 3.3 3" />
            </svg>
          </div>
          <div class="absolute -bottom-1.5 -right-1.5 w-6 h-6 rounded-full ${badge.color} border-[3px] border-white flex items-center justify-center">
            <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
              ${badge.icon}
            </svg>
          </div>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm text-gray-800 ${notif.is_read ? "" : "font-semibold"}">${notif.message}</p>
          <p class="text-xs text-gray-400 mt-1">${notif.time_ago}</p>
        </div>
        ${!notif.is_read ? '<span class="w-2.5 h-2.5 rounded-full bg-blue-500 shrink-0 mt-1.5"></span>' : ""}
      `;
        return item;
    }

    function buildSectionHeader(label, showSeeAll) {
        const header = document.createElement("div");
        header.className = "px-4 pt-3 pb-1 flex items-center justify-between";
        header.innerHTML = `
        <span class="text-sm font-bold text-gray-900">${label}</span>
        ${showSeeAll ? `<a href="{% url 'userNotifications' %}" class="text-xs font-semibold text-blue-600 hover:underline">See all</a>` : ""}
      `;
        return header;
    }

    function loadNotifications() {
        fetch(`{% url 'get_notifications_ajax' %}?filter=${currentNotifFilter}`)
            .then((res) => res.json())
            .then((data) => {
                notifList.innerHTML = "";

                if (data.notifications.length === 0) {
                    notifList.innerHTML =
                        '<div class="px-4 py-6 text-center text-sm text-gray-400">No notifications yet.</div>';
                    return;
                }

                const unread = data.notifications.filter((n) => !n.is_read);
                const read = data.notifications.filter((n) => n.is_read);

                if (unread.length > 0) {
                    notifList.appendChild(buildSectionHeader("New", true));
                    unread.forEach((notif) => notifList.appendChild(buildNotifItem(notif)));
                }

                if (read.length > 0) {
                    notifList.appendChild(buildSectionHeader("Yesterday", unread.length === 0));
                    read.forEach((notif) => notifList.appendChild(buildNotifItem(notif)));
                }

                const badge = document.getElementById("desktop_notif_badge");
                if (badge && data.unread_count === 0) {
                    badge.remove();
                } else if (badge) {
                    badge.textContent = data.unread_count;
                }
            });
    }

    function setNotifTab(filterValue) {
        currentNotifFilter = filterValue;

        [notifTabAll, notifTabUnread].forEach((tab) => {
            if (!tab) return;
            if (tab.dataset.filter === filterValue) {
                tab.classList.add("bg-blue-100", "text-blue-600");
                tab.classList.remove("text-gray-500", "hover:bg-gray-100");
            } else {
                tab.classList.remove("bg-blue-100", "text-blue-600");
                tab.classList.add("text-gray-500", "hover:bg-gray-100");
            }
        });

        loadNotifications();
    }

    if (notifTabAll) {
        notifTabAll.addEventListener("click", function() {
            setNotifTab("all");
        });
    }

    if (notifTabUnread) {
        notifTabUnread.addEventListener("click", function() {
            setNotifTab("unread");
        });
    }

    document.addEventListener("click", function(e) {
        if (
            notifDropdown &&
            !notifDropdown.classList.contains("hidden") &&
            !e.target.closest("#notif_dropdown") &&
            !e.target.closest("button[onclick='toggleNotifDropdown()']")
        ) {
            notifDropdown.classList.add("hidden");
            notifBellIcon.classList.remove("text-blue-600");
            notifBellIcon.classList.add("text-gray-500");
        }
    });
</script>
