<div class="flex items-center gap-2 mb-6">
    <span class="text-xs text-gray-500 mr-1">Showing:</span>
    <button type="button"
            data-period="7"
            class="period-filter-btn px-4 py-1.5 rounded-full text-xs font-medium border transition {% if period == '7' %}bg-blue-600 text-white border-blue-600 {% else %}bg-white text-gray-600 border-gray-300 hover:border-blue-400{% endif %}">
        Last 7 Days
    </button>
    <button type="button"
            data-period="30"
            class="period-filter-btn px-4 py-1.5 rounded-full text-xs font-medium border transition {% if period == '30' %}bg-blue-600 text-white border-blue-600 {% else %}bg-white text-gray-600 border-gray-300 hover:border-blue-400{% endif %}">
        Last 30 Days
    </button>
    <button type="button"
            data-period="all"
            class="period-filter-btn px-4 py-1.5 rounded-full text-xs font-medium border transition {% if period == 'all' %}bg-blue-600 text-white border-blue-600 {% else %}bg-white text-gray-600 border-gray-300 hover:border-blue-400{% endif %}">
        All Time
    </button>
</div>
<section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
    <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm flex items-center gap-4">
        <div class="bg-yellow-100 p-3 rounded-xl">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.5"
                 stroke="currentColor"
                 class="text-yellow-500 w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
        </div>
        <div>
            <p class="text-sm text-gray-500">Pending</p>
            <p class="text-2xl font-bold text-gray-800">{{ pending }}</p>
        </div>
    </div>
    <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm flex items-center gap-4">
        <div class="bg-blue-100 p-3 rounded-xl">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.5"
                 stroke="currentColor"
                 class="text-blue-500 w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75a4.5 4.5 0 0 1-4.884 4.484c-1.076-.091-2.264.071-2.95.904l-7.152 8.684a2.548 2.548 0 1 1-3.586-3.586l8.684-7.152c.833-.686.995-1.874.904-2.95a4.5 4.5 0 0 1 6.336-4.486l-3.276 3.276a3.004 3.004 0 0 0 2.25 2.25l3.276-3.276c.256.565.398 1.192.398 1.852Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.867 19.125h.008v.008h-.008v-.008Z" />
            </svg>
        </div>
        <div>
            <p class="text-sm text-gray-500">In Progress</p>
            <p class="text-2xl font-bold text-gray-800">{{ in_progress }}</p>
        </div>
    </div>
    <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm flex items-center gap-4">
        <div class="bg-green-100 p-3 rounded-xl">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.5"
                 stroke="currentColor"
                 class="text-green-500 w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18 9 11.25l4.306 4.306a11.95 11.95 0 0 1 5.814-5.518l2.74-1.22m0 0-5.94-2.281m5.94 2.28-2.28 5.941" />
            </svg>
        </div>
        <div>
            <p class="text-sm text-gray-500">Resolved This Week</p>
            <p class="text-2xl font-bold text-gray-800">{{ resolved_thisweek }}</p>
        </div>
    </div>
    <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm flex items-center gap-4">
        <div class="bg-purple-100 p-3 rounded-xl">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.5"
                 stroke="currentColor"
                 class="text-purple-500 w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z" />
            </svg>
        </div>
        <div>
            <p class="text-sm text-gray-500">Avg. Satisfaction</p>
            <p class="text-2xl font-bold text-gray-800">{{ avg_satisfaction }}/5</p>
        </div>
    </div>
</section>
<section class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
    <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
        <h2 class="text-base font-semibold text-gray-700 mb-4">Satisfaction Survey Results</h2>
        <div class="h-[300px] relative">
            <canvas id="satisfactionChart" height="150"></canvas>
        </div>
    </div>
    <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
        <h2 class="text-base font-semibold text-gray-700 mb-4">Most Reported Categories</h2>
        <div class="h-[300px] relative">
            <canvas id="categoriesChart" height="150"></canvas>
        </div>
    </div>
</section>
<section class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
    <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
        <h2 class="text-base font-semibold text-gray-700 mb-4">High Incident Locations</h2>
        <div class="h-[300px] relative">
            <canvas id="locationsChart" height="150"></canvas>
        </div>
    </div>
    <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
        <h2 class="text-base font-semibold text-gray-700 mb-4">Resolution Time: Expected vs. Actual</h2>
        <div class="h-[300px] relative">
            <canvas id="resolutionChart" height="150"></canvas>
        </div>
    </div>
</section>
