{% extends "layouts/base.html" %}
{% load static %}
{% block title %}Notifications - Fac-Check{% endblock %}
{% block content %}
    <div class="px-5 py-6 pb-24 lg:pb-6 lg:px-8 lg:py-8">
        <div class="mb-6">
            <h1 class="text-xl font-bold text-gray-900">Notifications</h1>
            <p class="text-sm text-gray-500 mt-1">Track new reports and closed concerns.</p>
        </div>
        <div class="flex items-center gap-2 mb-5">
            <button type="button"
                    id="notifTabAll"
                    data-filter="all"
                    class="notif-tab px-4 py-1.5 rounded-full text-sm font-semibold transition-colors">All</button>
            <button type="button"
                    id="notifTabUnread"
                    data-filter="unread"
                    class="notif-tab px-4 py-1.5 rounded-full text-sm font-semibold transition-colors">Unread</button>
        </div>
        <div id="notificationsContainer">
            {% include "partials/_notifications_rows.html" with notifications=notifications %}
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const tabAll = document.getElementById("notifTabAll");
            const tabUnread = document.getElementById("notifTabUnread");
            const container = document.getElementById("notificationsContainer");
            const tabs = [tabAll, tabUnread];

            function setActiveTab(filterValue) {
                tabs.forEach(function(tab) {
                    if (!tab) return;
                    if (tab.dataset.filter === filterValue) {
                        tab.classList.add("bg-blue-100", "text-blue-600");
                        tab.classList.remove("text-gray-500", "hover:bg-gray-100");
                    } else {
                        tab.classList.remove("bg-blue-100", "text-blue-600");
                        tab.classList.add("text-gray-500", "hover:bg-gray-100");
                    }
                });
            }

            function fetchNotifications(filterValue) {
                const url = new URL("{% url 'get_notifications_page_ajax_admin' %}", window.location.origin);
                url.searchParams.set("filter", filterValue);

                fetch(url)
                    .then(function(response) {
                        return response.json();
                    })
                    .then(function(data) {
                        container.innerHTML = data.html;
                    })
                    .catch(function(error) {
                        console.error("Failed to load notifications:", error);
                    });
            }

            function handleTabClick(filterValue) {
                setActiveTab(filterValue);
                fetchNotifications(filterValue);
            }

            if (tabAll) {
                tabAll.addEventListener("click", function() {
                    handleTabClick("all");
                });
            }

            if (tabUnread) {
                tabUnread.addEventListener("click", function() {
                    handleTabClick("unread");
                });
            }

            setActiveTab("{{ notif_filter|default:'all' }}");
        });
    </script>
{% endblock %}
