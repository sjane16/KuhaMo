{% extends "layouts/base.html" %} {% block content %}
<main class="flex-1 px-6 lg:px-10 xl:px-16 pt-6 pb-10 w-full">
  <h1 class="text-lg font-bold text-gray-800">Admin's Dashboard</h1>
  <p class="text-sm text-gray-600">
    Manage all the facility concerns reported at the university.
  </p>

  <section class="w-full mt-6">
    <div
      class="text-gray-600 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 w-full"
    >
      <div class="border border-gray-300 bg-white p-4 rounded-3xl shadow">
        <span
          class="float-right bg-blue-100 p-2 rounded-full inline-flex items-center justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="36"
            height="36"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-blue-500"
          >
            <path
              d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"
            />
            <rect x="9" y="3" width="6" height="4" rx="1" />
            <line x1="9" y1="12" x2="15" y2="12" />
            <line x1="9" y1="16" x2="13" y2="16" />
          </svg>
        </span>
        Total Reports
        <p class="text-2xl font-bold text-gray-800 mt-2">120</p>
      </div>

      <div class="border border-gray-300 bg-white p-4 rounded-3xl shadow">
        <span
          class="float-right bg-red-100 p-2 rounded-full inline-flex items-center justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="36"
            height="36"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-red-500"
          >
            <path
              d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
            />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
        </span>
        High Priority
        <p class="text-2xl font-bold text-gray-800 mt-2">35</p>
      </div>

      <div class="border border-gray-300 bg-white p-4 rounded-3xl shadow">
        <span
          class="float-right bg-yellow-100 p-2 rounded-full inline-flex items-center justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="36"
            height="36"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-yellow-500"
          >
            <path
              d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            />
          </svg>
        </span>
        For Repair
        <p class="text-2xl font-bold text-gray-800 mt-2">45</p>
      </div>

      <div class="border border-gray-300 bg-white p-4 rounded-3xl shadow">
        <span
          class="float-right bg-gray-100 p-2 rounded-full inline-flex items-center justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="36"
            height="36"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-gray-400"
          >
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
          </svg>
        </span>
        For Disposal
        <p class="text-2xl font-bold text-gray-800 mt-2">10</p>
      </div>
    </div>
  </section>
</main>
{% endblock %}
